# See also: https://github.com/tmux/tmux/wiki/Getting-Started

##################################################
# General options
##################################################
set-option -g default-shell /bin/zsh
set-option -sg escape-time 10
# Enable extended keys (CSI u encoding) for better modifier key support
# Allows terminals to send distinct codes for keys like Ctrl+' that normally can't be distinguished
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# set -as terminal-features ',rxvt-unicode-256color:clipboard'
# set -g default-terminal "xterm-256color"
set -g default-terminal "screen-256color"
set-option -sa terminal-features ',xterm-256color:RGB'
set-option -g focus-events
# Define environment variables that should be updated when starting a TMUX session.
# Tmux inherits the full environment when the **server** first starts,
# but it seems part of my .zshrc and stuff isn't loaded then which at least lead to
# issues with using GCM from Windows.
# This is a space separated list of env.vars that should be updated when tmux starts a new session.
set-option -g update-environment "GPG_TTY SSH_AUTH_SOCK"

##################################################
# Enable copy-mode-vi
##################################################
setw -g mode-keys vi
bind-key -n F4 copy-mode # Start copy-mode with F4 (TODO: consider another keybinding)
bind-key c copy-mode # Removes default binding for new window, but I don't think I will be using that

##################################################
# Setup more vim-like keybindings
##################################################
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R
bind-key K resize-pane -U 5
bind-key J resize-pane -D 5

##################################################
# Setup other keybindings
##################################################
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

##################################################
# Set up movememnt between panes like I have in VS Code
##################################################
# Helper: select pane by position (uses pane coordinates, not indices)
# top-left:    sort by top asc, left asc  → first result
# top-right:   sort by top asc, left desc → first result
# bottom-left: sort by top desc, left asc → first result

# Ctrl+Alt+l: go to upper-right, unless already there then go to upper-left
bind-key -n C-M-l run-shell '\
    topright=$(tmux list-panes -F "##{pane_id} ##{pane_top} ##{pane_left}" | sort -t" " -k2,2n -k3,3nr | head -1 | cut -d" " -f1); \
    current=$(tmux display -p "##{pane_id}"); \
    if [ "$current" = "$topright" ]; then \
        tmux select-pane -t $(tmux list-panes -F "##{pane_id} ##{pane_top} ##{pane_left}" | sort -t" " -k2,2n -k3,3n | head -1 | cut -d" " -f1); \
    else \
        tmux select-pane -t $topright; \
    fi'
# Alt+t: go to bottom-left, unless already there then go to last pane
bind-key -n M-t run-shell '\
    bottomleft=$(tmux list-panes -F "##{pane_id} ##{pane_top} ##{pane_left}" | sort -t" " -k2,2nr -k3,3n | head -1 | cut -d" " -f1); \
    current=$(tmux display -p "##{pane_id}"); \
    if [ "$current" = "$bottomleft" ]; then \
        tmux select-pane -t {last}; \
    else \
        tmux select-pane -t $bottomleft; \
    fi'

##################################################
# Setup aliases
##################################################
set -s 'command-alias[100]' 'vsp=split-window -h'
set -s 'command-alias[101]' 'tsw=split-window -h npx tsc -w'
set -s 'command-alias[102]' 'exit=kill-session'
set -s 'command-alias[103]' 'tu=resize-pane -U'
set -s 'command-alias[104]' 'td=resize-pane -D'

# TO TEST FORMATS: tmux display -pv '#{==:#{CODESPACES},true}'

##################################################
# Setup clipboard mode
##################################################
%if #{==:#{CODESPACES},true}
    # Create a "fake clipboard", this will allow copying internally in codespaces running in the web using VIM copy mode
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'tee /tmp/clipboard_plus.txt'
%elif #{==:#{xclip_working},true}
    # Copy to xclip for sharing with system clipboard
    bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
%else
    display-message "XClip not working"
%endif

